openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BarberApp API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client operations
  - name: services
    description: Service operations
  - name: appointments
    description: Appointment operations
  - name: queue
    description: Queue operations
  - name: dashboard
    description: Dashboard operations
  - name: financial
    description: Financial operations
  - name: settings
    description: Settings operations
  - name: barbers
    description: Barber operations
  - name: combo-discounts
    description: Combo discount operations
  - name: loyalty
    description: Loyalty points operations
  - name: subscription-plans
    description: Subscription plan operations
  - name: subscriptions
    description: Client subscription operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all services
      parameters:
        - name: shopId
          in: query
          description: Shop owner user ID (required for public booking page)
          schema:
            type: string
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments
      parameters:
        - name: date
          in: query
          description: "Single date (YYYY-MM-DD). Ignored when dateStart/dateEnd are provided."
          schema:
            type: string
        - name: dateStart
          in: query
          description: "Start date (YYYY-MM-DD) for range filter."
          schema:
            type: string
        - name: dateEnd
          in: query
          description: "End date (YYYY-MM-DD) for range filter."
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /appointments/{id}/start:
    post:
      operationId: startAppointment
      tags: [appointments]
      summary: Start an appointment (set status to in_progress)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}/complete:
    post:
      operationId: completeAppointment
      tags: [appointments]
      summary: Complete an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}/cancel:
    post:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Cancel an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/by-token/{token}:
    get:
      operationId: getAppointmentByToken
      tags: [appointments]
      summary: Get an appointment by its public cancel token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/by-token/{token}/cancel:
    post:
      operationId: cancelAppointmentByToken
      tags: [appointments]
      summary: Cancel an appointment using its public cancel token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/by-token/{token}/reschedule:
    post:
      operationId: rescheduleAppointmentByToken
      tags: [appointments]
      summary: Reschedule an appointment using its public cancel token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleByTokenInput"
      responses:
        "200":
          description: Rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /b/{slug}/next-available:
    get:
      operationId: getNextAvailable
      tags: [appointments]
      summary: Get next available slot for a public shop (no auth required)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Next available slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextAvailableResult"
        "404":
          description: Shop not found

  /availability:
    get:
      operationId: getAvailability
      tags: [appointments]
      summary: Get available time slots for a date and service
      parameters:
        - name: shopId
          in: query
          description: Shop owner user ID (required for public booking page)
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: YYYY-MM-DD
        - name: serviceId
          in: query
          schema:
            type: integer
        - name: serviceDuration
          in: query
          description: Total duration in minutes — required when serviceId is not provided (multi-service bookings)
          schema:
            type: integer
        - name: barberId
          in: query
          description: Filter availability to the agenda of one barber. If omitted, conflicts are checked across all appointments.
          schema:
            type: integer
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"

  /queue:
    get:
      operationId: listQueue
      tags: [queue]
      summary: List queue entries
      responses:
        "200":
          description: Queue list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"
    post:
      operationId: addToQueue
      tags: [queue]
      summary: Add client to queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueInput"
      responses:
        "201":
          description: Added to queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"

  /queue/{id}:
    delete:
      operationId: removeFromQueue
      tags: [queue]
      summary: Remove from queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /queue/{id}/start:
    post:
      operationId: startQueueEntry
      tags: [queue]
      summary: Start serving a queue entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /financial/summary:
    get:
      operationId: getFinancialSummary
      tags: [financial]
      summary: Get financial summary
      parameters:
        - name: dateStart
          in: query
          description: "Start date (YYYY-MM-DD). Defaults to start of current month."
          schema:
            type: string
        - name: dateEnd
          in: query
          description: "End date (YYYY-MM-DD). Defaults to end of current month."
          schema:
            type: string
        - name: month
          in: query
          description: "Legacy month (1-12). Ignored when dateStart/dateEnd are provided."
          schema:
            type: integer
        - name: year
          in: query
          description: "Legacy year. Ignored when dateStart/dateEnd are provided."
          schema:
            type: integer
        - name: day
          in: query
          description: "Legacy day (1-31). Ignored when dateStart/dateEnd are provided."
          schema:
            type: integer
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  /barbers:
    get:
      operationId: listBarbers
      tags: [barbers]
      summary: List barbers
      parameters:
        - name: shopId
          in: query
          description: Shop owner user ID (required for public booking page)
          schema:
            type: string
        - name: activeOnly
          in: query
          schema:
            type: boolean
        - name: serviceId
          in: query
          description: Only return barbers that perform this service
          schema:
            type: integer
      responses:
        "200":
          description: List of barbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Barber"
    post:
      operationId: createBarber
      tags: [barbers]
      summary: Create a barber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barber"

  /barbers/{id}:
    get:
      operationId: getBarber
      tags: [barbers]
      summary: Get a barber
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Barber
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barber"
    patch:
      operationId: updateBarber
      tags: [barbers]
      summary: Update a barber
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barber"
    delete:
      operationId: deleteBarber
      tags: [barbers]
      summary: Delete a barber
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/account:
    delete:
      operationId: deleteAccount
      tags: [settings]
      summary: Delete the authenticated user's account and all associated data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletion"
      responses:
        "204":
          description: Account deleted
        "401":
          description: Not authenticated or wrong credentials

  /users/slug:
    patch:
      operationId: updateUserSlug
      tags: [settings]
      summary: Update the barber's custom booking URL slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlugUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSlugResponse"
        "409":
          description: Slug already taken

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get barbershop settings
      parameters:
        - name: shopId
          in: query
          description: Shop owner user ID (required for public booking page)
          schema:
            type: string
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update barbershop settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /loyalty/clients:
    get:
      operationId: listLoyaltyClients
      tags: [loyalty]
      summary: List all clients with loyalty points for the authenticated shop
      responses:
        "200":
          description: List of clients with points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoyaltyClientBalance"

  /loyalty/balance:
    get:
      operationId: getLoyaltyBalance
      tags: [loyalty]
      summary: Get loyalty points balance for a client phone
      parameters:
        - name: shopId
          in: query
          description: Shop owner user ID
          schema:
            type: string
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Loyalty balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyBalance"

  /combo-discounts:
    get:
      operationId: listComboDiscounts
      tags: [combo-discounts]
      summary: List combo discounts
      parameters:
        - name: shopId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of combo discounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComboDiscount"
    post:
      operationId: createComboDiscount
      tags: [combo-discounts]
      summary: Create a combo discount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComboDiscountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComboDiscount"

  /combo-discounts/{id}:
    patch:
      operationId: updateComboDiscount
      tags: [combo-discounts]
      summary: Update a combo discount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComboDiscountInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComboDiscount"
    delete:
      operationId: deleteComboDiscount
      tags: [combo-discounts]
      summary: Delete a combo discount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subscription-plans:
    get:
      operationId: listSubscriptionPlans
      tags: [subscription-plans]
      summary: List subscription plans for a shop
      parameters:
        - name: shopId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"
    post:
      operationId: createSubscriptionPlan
      tags: [subscription-plans]
      summary: Create a subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"

  /subscription-plans/{id}:
    patch:
      operationId: updateSubscriptionPlan
      tags: [subscription-plans]
      summary: Update a subscription plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPlanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
    delete:
      operationId: deleteSubscriptionPlan
      tags: [subscription-plans]
      summary: Delete a subscription plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List all client subscriptions for the authenticated shop
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSubscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Subscribe a client to a plan (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSubscription"

  /subscriptions/{id}:
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update subscription status (activate/cancel)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSubscription"

  /subscriptions/check:
    get:
      operationId: checkSubscription
      tags: [subscriptions]
      summary: Check if a phone number has an active subscription
      parameters:
        - name: shopId
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckResult"

components:
  schemas:
    RescheduleByTokenInput:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt:
          type: string
          description: ISO 8601 datetime of the new slot
        barberId:
          type: integer
          description: Optionally switch barber when rescheduling

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Client:
      type: object
      required: [id, name, phone, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ClientInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        notes:
          type: string

    ClientUpdate:
      type: object
