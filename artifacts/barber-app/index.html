<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Agenda Play — Agendamentos</title>
    <meta name="description" content="Agende seu horário na barbearia em poucos toques. Escolha o profissional, o serviço e o melhor horário." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F59E0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda Play" />
    <script>
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var isMobileUA = /android|iphone|ipad|ipod|mobile|webos|blackberry|opera mini/i.test(ua);
        var hasParam = window.location.search.includes("view=mobile");
        var hasFlag = window.__AGENDAPLAY_MOBILE__ === true;
        if (isMobileUA || hasParam || hasFlag) {
          document.documentElement.classList.add("mobile-view");
        }
      })();
    </script>
    <style>
      html.mobile-view aside,
      html.mobile-view [data-slot="sidebar"],
      html.mobile-view [data-slot="sidebar-gap"],
      html.mobile-view [data-slot="sidebar-container"],
      html.mobile-view [data-sidebar="sidebar"] {
        display: none !important;
      }
      html.mobile-view .md\:peer-data-\[variant\=inset\]\:m-2,
      html.mobile-view .md\:peer-data-\[variant\=inset\]\:ml-0 {
        margin: 0 !important;
      }
    </style>
